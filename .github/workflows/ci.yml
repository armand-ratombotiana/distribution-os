# Continuous integration for Distribution OS.
#
# Runs on every push to `main` and on every pull request targeting `main`.
# The pipeline installs dependencies through the Sites runtime shim
# (scripts/install-ci.sh), lints the codebase, runs the TypeScript test
# suite, executes the build-dependent .test.mjs suite, and finally
# verifies the production build.
#
# The Sites runtime shim relies on Linux-specific utilities
# (flock, GNU timeout, curl, sha256sum), so the job always runs on
# Ubuntu. See scripts/install-ci.sh and scripts/build-verified.sh.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow + ref so force-pushes and
# rebases do not burn CI minutes on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Install · Lint · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Linux system dependencies
        run: |
          set -euo pipefail
          for bin in flock timeout curl sha256sum node npm; do
            command -v "$bin" >/dev/null || {
              echo "Required binary '$bin' is missing on the runner." >&2
              exit 69
            }
          done
          echo "All Sites runtime prerequisites are available."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (Sites runtime)
        env:
          SITES_INSTALL_TIMEOUT: 10m
        run: npm run install:ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run TypeScript tests
        run: npm run test:ts

      - name: Run build-dependent test suite
        run: npm run test

      - name: Build
        env:
          SITES_BUILD_TIMEOUT: 5m
        run: npm run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            .worker/dist
            .openai
          if-no-files-found: ignore
          retention-days: 7

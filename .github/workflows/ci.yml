# Continuous integration for Distribution OS.
#
# Runs on every push to `main` and on every pull request targeting `main`.
# Pipeline: install deps (Sites runtime shim) -> lint -> test -> build.
# The TypeScript test suite is executed directly through the `tsx`
# loader via `node --import tsx --test tests/*.test.ts`, so the suite
# runs without a prior production build. The build step at the end
# verifies that the Worker still compiles for Cloudflare deployment.
#
# The Sites runtime shim relies on Linux-specific utilities
# (flock, GNU timeout, curl, sha256sum), so the job always runs on
# Ubuntu. See scripts/install-ci.sh and scripts/build-verified.sh.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow + ref so force-pushes and
# rebases do not burn CI minutes on superseded commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Install · Lint · Test · Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Linux system dependencies
        run: |
          set -euo pipefail
          for bin in flock timeout curl sha256sum node npm; do
            command -v "$bin" >/dev/null || {
              echo "Required binary '$bin' is missing on the runner." >&2
              exit 69
            }
          done
          echo "All Sites runtime prerequisites are available."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (Sites runtime)
        env:
          SITES_INSTALL_TIMEOUT: 10m
        run: npm run install:ci

      - name: Lint
        run: npm run lint

      - name: Run TypeScript tests
        run: node --import tsx --test tests/*.test.ts

      - name: Build
        env:
          SITES_BUILD_TIMEOUT: 5m
        run: npm run build

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            .worker/dist
            .openai
          if-no-files-found: ignore
          retention-days: 7
